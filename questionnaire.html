<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Confidential Questionnaire | JD Strategic Franchising</title>
<meta name="description" content="The questions Josh DuBois would ask on the call, answered first. One question at a time, saved as you go, completely confidential.">
<meta name="theme-color" content="#0A1D3A">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..800;1,400..700&family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   JD STRATEGIC — CONFIDENTIAL QUESTIONNAIRE
   One question per screen. The journey pattern is the house one measured from
   builds/mmi-money-type-quiz-funnel: fixed topbar + progress, centred question
   card, stacked option buttons with a fill-on-select indicator, disabled-until-
   answered advance. Skin is jd-strategic-site: Playfair + Inter, navy ink,
   0 radius, hairline rules, orange rationed.

   ACCENT RAMP — the one deliberate deviation from the site's own CSS.
   #FF6A00 measures 2.87:1 on white, so it is illegal for text at any size.
   The site ships that on .eyebrow.gold and .num; it is not replicated here.
     --accent      #FF6A00  non-text only: fills, bars, rules, focus, marks
     --accent-deep #E55F00  3.5:1 — accent text 24px and up
     --accent-ink  #C94E00  4.6:1 — accent text below 24px
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#0A1D3A;
  --ink-deep:#061020;
  --body:#5A6B7E;
  --muted:#6E7F92;
  --faint:#AEB9C6;
  --hairline:#E4E8ED;
  --hairline-2:#EFF2F5;
  --canvas:#FFFFFF;
  --cream:#FAF9F7;
  --accent:#FF6A00;
  --accent-deep:#E55F00;
  --accent-ink:#C94E00;
  --accent-wash:rgba(255,106,0,.07);

  --fd:'Playfair Display',Georgia,'Times New Roman',serif;
  --fb:'Inter',system-ui,-apple-system,sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --top-h:66px;
  --gut:clamp(22px,5vw,40px);
  --foot-h:64px;
}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--cream);color:var(--body);
  font-family:var(--fb);font-size:17px;line-height:1.62;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  font-optical-sizing:auto;
  font-feature-settings:'cv05' 1,'cv08' 1,'cv11' 1,'ss03' 1;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
body.scrollable{overflow:auto}
h1,h2,h3{margin:0;font-family:var(--fd);color:var(--ink);font-weight:700;line-height:1.06;letter-spacing:-.014em;font-optical-sizing:auto;text-wrap:balance}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:rgba(255,106,0,.16);color:var(--ink)}

/* ==========================================================================
   TOPBAR + PROGRESS
   ========================================================================== */
.top{
  position:fixed;top:0;left:0;right:0;z-index:60;height:var(--top-h);
  background:var(--ink);display:flex;align-items:center;
  padding-inline:clamp(18px,3.2vw,34px);gap:clamp(16px,3vw,38px);
}
.top .brand{display:inline-flex;align-items:center;gap:10px;flex:none;text-decoration:none}
.top .mark{width:30px;height:30px;border:1px solid rgba(255,255,255,.42);display:grid;place-items:center;color:#fff;font-family:var(--fd);font-size:12px;font-weight:700;letter-spacing:.04em}
.top .wm{display:flex;flex-direction:column;line-height:1}
.top .wm b{font-family:var(--fd);font-size:14.5px;font-weight:700;color:#fff}
.top .wm span{font-size:8px;font-weight:600;letter-spacing:.32em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-top:5px}
.top .ct{margin-left:auto;display:flex;align-items:center;gap:clamp(12px,2vw,22px);flex:none}
.counter{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.62);font-variant-numeric:tabular-nums;white-space:nowrap}
.saved{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);opacity:0;transition:opacity .45s ease;white-space:nowrap}
.saved.on{opacity:1}
.saved svg{width:12px;height:12px}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.bar i{display:block;height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .65s var(--ease)}

/* ==========================================================================
   STAGE — one screen at a time, vertically centred
   ========================================================================== */
.stage{
  position:fixed;top:var(--top-h);left:0;right:0;bottom:calc(var(--foot-h) + env(safe-area-inset-bottom));
  overflow-y:auto;overflow-x:hidden;
  display:flex;align-items:center;
  padding:clamp(28px,5vh,64px) var(--gut) clamp(40px,7vh,80px);
}
.card{width:100%;max-width:720px;margin:0 auto}
.card.in{animation:cardIn .52s var(--ease) both}
.card.in.bk{animation-name:cardInRev}
@keyframes cardIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
@keyframes cardInRev{from{opacity:0;transform:translateY(-22px)}to{opacity:1;transform:none}}

/* ---------- question head ---------- */
.chip{
  display:inline-flex;align-items:center;gap:9px;margin-bottom:24px;
  padding:8px 13px;border:1px solid rgba(201,78,0,.3);background:var(--accent-wash);
  font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);
}
.chip i{width:5px;height:5px;background:var(--accent);flex:none;display:block}
.qn{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qn b{font-family:var(--fb);font-size:12.5px;font-weight:700;letter-spacing:.18em;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.qn svg{width:13px;height:13px;color:var(--accent-ink)}
.qt{font-family:var(--fd);font-size:clamp(25px,3.5vw,40px);font-weight:700;line-height:1.14;letter-spacing:-.016em;color:var(--ink);text-wrap:pretty}
.qt .it{font-style:italic;color:var(--accent-deep);font-weight:600}
.qh{margin-top:16px;font-size:15.5px;line-height:1.62;color:var(--muted);max-width:56ch;text-wrap:pretty}
.qb{margin-top:clamp(28px,4vh,42px)}

/* ---------- open fields: underline, never a box ---------- */
.fin{
  width:100%;border:0;border-bottom:1.5px solid var(--hairline);background:transparent;
  font-size:clamp(19px,2.1vw,25px);line-height:1.5;color:var(--ink);
  padding:2px 2px 9px;border-radius:0;-webkit-appearance:none;appearance:none;
  transition:border-color .28s var(--ease);
}
.fin::placeholder{color:var(--faint)}
.fin:hover{border-bottom-color:#C6D0DB}
.fin:focus{outline:none;border-bottom-color:var(--ink);box-shadow:0 1.5px 0 0 var(--ink)}
textarea.fin{resize:none;overflow:hidden;min-height:0;line-height:1.5}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 30px}
.pl{display:block;font-size:11.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fwrap{position:relative;display:block}
.fwrap.bad .fin{border-bottom-color:var(--accent-ink);box-shadow:0 1.5px 0 0 var(--accent-ink)}
.err{display:none;margin-top:11px;font-size:13.5px;font-weight:600;color:var(--accent-ink);line-height:1.45}
.fwrap.bad .err{display:block}

/* ---------- option buttons ---------- */
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  position:relative;display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  padding:17px 46px 17px 17px;background:var(--canvas);border:1px solid var(--hairline);
  font-size:16px;line-height:1.45;color:var(--ink);
  transition:border-color .34s var(--ease),transform .34s var(--ease),background .34s var(--ease),color .34s var(--ease);
}
.opt .k{
  width:28px;height:28px;flex:none;display:grid;place-items:center;
  border:1px solid var(--hairline);font-size:11.5px;font-weight:700;letter-spacing:.04em;
  color:var(--muted);font-variant-numeric:tabular-nums;
  transition:border-color .34s var(--ease),background .34s var(--ease),color .34s var(--ease);
}
.opt .tick{
  position:absolute;right:16px;top:50%;transform:translateY(-50%) scale(.5);opacity:0;
  width:19px;height:19px;color:var(--accent);
  transition:opacity .3s var(--ease),transform .3s var(--ease);
}
.opt:hover{transform:translateX(3px);border-color:var(--ink)}
.opt:hover .k{border-color:var(--ink);color:var(--ink)}
.opt.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.opt.sel .k{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.sel .tick{opacity:1;transform:translateY(-50%) scale(1)}
.opt.sel:hover{transform:translateX(3px)}
.opts.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.opts.grid .opt{padding:15px 40px 15px 15px;font-size:15px;gap:13px}
.opts.grid .opt .k{width:25px;height:25px;font-size:11px}

/* ---------- 1–5 scale ---------- */
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;max-width:520px}
.sc{
  position:relative;display:grid;place-items:center;height:clamp(64px,9vh,84px);
  background:var(--canvas);border:1px solid var(--hairline);
  font-family:var(--fd);font-size:23px;font-weight:700;color:var(--faint);
  font-variant-numeric:lining-nums;
  transition:border-color .3s var(--ease),background .3s var(--ease),color .3s var(--ease),transform .3s var(--ease);
}
.sc:hover{border-color:var(--ink);color:var(--ink);transform:translateY(-3px)}
.sc.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.sclab{display:flex;justify-content:space-between;max-width:520px;margin-top:14px;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}

/* ---------- advance row ---------- */
.go{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:clamp(30px,4.5vh,46px)}
.btn{
  display:inline-flex;align-items:center;gap:22px;
  font-size:13px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
  padding:18px 26px;border:1px solid transparent;
  transition:background .3s var(--ease),color .3s var(--ease),border-color .3s var(--ease),opacity .3s var(--ease);
}
.btn svg{width:16px;height:16px;flex:none;transition:transform .34s var(--ease)}
.btn:hover svg{transform:translateX(5px)}
.btn-solid{background:var(--ink);color:#fff}
.btn-solid svg{color:var(--accent)}
.btn-solid:hover{background:var(--ink-deep)}
.btn-solid:disabled{opacity:.3;cursor:not-allowed}
.btn-solid:disabled:hover{background:var(--ink)}
.btn-solid:disabled:hover svg{transform:none}
.btn-ghost{border-color:var(--ink);color:var(--ink)}
.btn-ghost svg{color:var(--accent-ink)}
.btn-ghost:hover{background:var(--ink);color:#fff}
.btn-ghost:hover svg{color:var(--accent)}
.btn.back{justify-content:flex-start;gap:12px;border-color:var(--hairline);padding-inline:22px}
.btn.back:hover{border-color:var(--ink)}
.btn.back:hover svg{transform:translateX(-5px)}
.btn.back:disabled{opacity:.32;cursor:not-allowed}
.btn.back:disabled:hover{background:transparent;color:var(--ink);border-color:var(--hairline)}
.btn.back:disabled:hover svg{transform:none;color:var(--accent-ink)}
.hint{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.hint kbd{
  font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.06em;
  border:1px solid var(--hairline);background:var(--canvas);padding:4px 7px;color:var(--ink);
}
@media (hover:none){.hint{display:none}}

/* ==========================================================================
   WELCOME — the site's own hero device: copy left on cream, photography
   bleeding to the right edge at full height. Same split, same proportions.
   ========================================================================== */
body.welcome .stage{padding:0;align-items:stretch;overflow:hidden}
body.welcome .card{max-width:none;margin:0;width:100%;display:flex}
.wcard{display:grid;grid-template-columns:minmax(0,1.02fr) minmax(0,1fr);width:100%;align-items:stretch}
.wcopy{
  position:relative;display:flex;flex-direction:column;justify-content:center;
  padding:clamp(34px,4.4vw,64px) clamp(30px,3.6vw,60px);
  width:100%;max-width:748px;margin-left:auto;
}
.wcopy::before{content:"";position:absolute;left:0;top:clamp(34px,4.4vw,64px);bottom:clamp(34px,4.4vw,64px);width:3px;background:var(--accent)}
.wcopy .chip,.wcopy .go,.wcopy .sig{align-self:flex-start}
.wcopy .qt{font-size:clamp(30px,3.6vw,50px)}
/* the emphasis line always gets its own line - it is the whole device */
.wcopy .qt .it{display:block}
.wcopy .qh{font-size:16.5px;max-width:50ch;margin-top:18px}
/* the welcome carries its own reassurance and has nowhere to go back to */
body.welcome .ctrl,body.welcome .legal{display:none}
body.welcome .stage{bottom:0}
/* photo panel + floating quote plate, lifted from the site's own hero */
.wfig{position:relative;overflow:hidden;background:var(--ink);min-height:0}
.wfig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:52% 28%}
.wquote{
  position:absolute;right:0;bottom:clamp(26px,4.4vw,58px);z-index:2;
  max-width:min(410px,74%);
  background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
  padding:24px 28px 24px 24px;
  display:grid;grid-template-columns:auto minmax(0,1fr);gap:15px;align-items:start;
  box-shadow:0 34px 70px -34px rgba(6,16,32,.55),0 2px 6px -2px rgba(6,16,32,.16);
}
.wquote .qm{font-family:var(--fd);font-size:44px;font-weight:700;color:var(--accent);line-height:.7;margin-top:6px}
.wquote p{font-size:15px;line-height:1.5;color:var(--ink)}
.wquote cite{display:block;margin-top:9px;font-style:normal;font-size:12.5px;color:var(--accent-ink);font-weight:600}

/* signature — a person is asking, not a form */
.sig{display:flex;align-items:center;gap:14px;margin-top:30px;padding-top:26px;border-top:1px solid var(--hairline)}
.sig img{width:46px;height:46px;object-fit:cover;object-position:center 26%;flex:none}
.sig b{display:block;font-family:var(--fd);font-size:16.5px;font-weight:700;color:var(--ink);letter-spacing:-.006em}
.sig i{display:block;font-style:normal;font-size:9.5px;font-weight:700;letter-spacing:.19em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.hp{position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden;opacity:0}
.senderr{
  display:none;margin-top:18px;padding:15px 17px;border-left:3px solid var(--accent);
  background:var(--accent-wash);font-size:14px;line-height:1.55;color:var(--ink);max-width:56ch;
}
.senderr.on{display:block}
.senderr b{font-weight:700}
.senderr a{color:var(--accent-ink);font-weight:600}
.reassure{margin-top:20px;font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.reassure b{color:var(--ink);font-weight:600}
.rev{border:1px solid var(--hairline);background:var(--canvas);max-height:min(42vh,400px);overflow-y:auto;padding:6px 22px}
.rev h4{font-family:var(--fb);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-ink);margin:22px 0 10px;padding-bottom:9px;border-bottom:1px solid var(--ink)}
.rev .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;padding:9px 0;border-bottom:1px solid var(--hairline-2);font-size:13.5px;line-height:1.5}
.rev .r:last-child{border-bottom:0}
.rev .r .k{color:var(--muted)}
.rev .r .v{color:var(--ink);white-space:pre-wrap}
.rev .none{padding:18px 0;font-size:14px;color:var(--muted)}
.edit{position:relative;background:none;border:0;color:var(--accent-ink);font-size:12px;font-weight:700;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;padding:0;margin-left:8px;cursor:pointer}
.edit::after,.legal button::after{content:"";position:absolute;inset:-13px -10px}

/* ---------- footer controls ----------
   A solid bar, and the stage stops above it. Floating, these sat on top of
   Back, Continue and Send whenever that row scrolled near the bottom, and
   Start over over Back is one mis-tap from "clear every answer". */
.ctrl{
  position:fixed;right:var(--gut);bottom:calc((var(--foot-h) - 44px) / 2 + env(safe-area-inset-bottom));z-index:56;
  display:flex;gap:1px;
}
.ctrl button{
  width:44px;height:44px;display:grid;place-items:center;
  background:var(--canvas);border:1px solid var(--hairline);color:var(--ink);
  transition:background .25s var(--ease),border-color .25s var(--ease),color .25s var(--ease),opacity .25s ease;
}
.ctrl button:hover:not(:disabled){background:var(--ink);border-color:var(--ink);color:#fff}
.ctrl button:disabled{opacity:.34;cursor:not-allowed}
.ctrl svg{width:15px;height:15px}
.legal{
  position:fixed;left:0;right:0;bottom:0;z-index:55;
  height:calc(var(--foot-h) + env(safe-area-inset-bottom));
  padding:0 var(--gut) env(safe-area-inset-bottom);
  background:var(--cream);border-top:1px solid var(--hairline);
  font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:14px;
}
.legal button{position:relative;font-size:11.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.legal button:hover{color:var(--accent-ink)}
@media (max-width:700px){.legal span{display:none}}

/* ---------- done ---------- */
.done{
  position:fixed;inset:0;z-index:70;background:var(--ink);color:rgba(255,255,255,.72);
  display:none;align-items:center;overflow-y:auto;padding:clamp(40px,8vh,90px) var(--gut);
}
.done.on{display:flex}
.done-in{max-width:640px;margin:0 auto;width:100%}
.done .mark{width:60px;height:60px;border:1px solid var(--accent);display:grid;place-items:center;color:var(--accent);margin-bottom:32px}
.done .mark svg{width:25px;height:25px}
.done h2{color:#fff;font-size:clamp(33px,5vw,58px);line-height:1.05}
.done h2 .it{font-style:italic;color:var(--accent);font-weight:600}
.done p{color:rgba(255,255,255,.7);font-size:clamp(16px,1.4vw,18.5px);line-height:1.66;margin-top:24px;max-width:50ch;text-wrap:pretty}
.done .acts{display:flex;flex-wrap:wrap;gap:11px;margin-top:38px}
.done .btn-light{background:#fff;color:var(--ink)}
.done .btn-light svg{color:var(--accent-ink)}
.done .btn-out{border-color:rgba(255,255,255,.34);color:#fff}
.done .btn-out svg{color:var(--accent)}
.done .btn-out:hover{background:#fff;color:var(--ink)}

/* ---------- print ---------- */
.psum{display:none}
@media print{
  .top,.stage,.ctrl,.legal,.done .mark,.done h2,.done p,.done .acts{display:none!important}
  .done{position:static;display:block!important;background:#fff!important;color:#111!important;padding:0!important}
  .psum{display:block!important;color:#111}
  .psum h1{font-size:26px;font-family:var(--fd);margin-bottom:5px}
  .psum .sub{font-size:11.5px;color:#555;margin-bottom:24px}
  .psum h2{font-size:12px;font-family:var(--fb);letter-spacing:.16em;text-transform:uppercase;border-bottom:1.5px solid #111;padding-bottom:5px;margin:22px 0 10px;color:#111}
  .psum .r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:14px;padding:6px 0;border-bottom:1px solid #E4E8ED;font-size:11.5px;line-height:1.5;break-inside:avoid}
  .psum .r .k{font-weight:600;color:#111}
  .psum .r .v{color:#333;white-space:pre-wrap}
  body{overflow:visible}
  @page{margin:15mm}
}

/* ==========================================================================
   BUNDLED SCREENS — several related questions answered in one breath.
   The big Playfair line is the conversational beat; the items under it carry
   quiet uppercase labels so the screen still reads as one question, not a form.
   ========================================================================== */
/* controls bottom-align, so two items sharing a row put their underlines on
   the same line no matter how tall their labels or helper text run */
.items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(22px,3.2vh,34px) 26px;align-items:end}
.item{grid-column:1/-1;min-width:0}
.item[data-half]{grid-column:auto}
.item.hide{display:none}
.il{display:block;font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--ink);margin-bottom:6px;line-height:1.45}
.il em{font-style:normal;color:var(--accent-ink)}
.ih{display:block;font-size:13.5px;line-height:1.55;color:var(--muted);margin:-1px 0 9px;max-width:58ch;text-wrap:pretty}
.item .fin{font-size:clamp(17px,1.5vw,19px);padding:1px 2px 7px;line-height:1.35}
.item textarea.fin{min-height:0;height:30px;line-height:1.45}
.item .opts{gap:7px}
/* a short choice list (Yes / No, three brief options) sits in a row so its
   height matches a text field instead of towering over one */
.item .opts.bin{flex-direction:row;flex-wrap:wrap;gap:8px}
.item .opts.bin .opt{width:auto;flex:0 0 auto;min-width:126px}
/* short answers get short fields - a full-bleed rule under a two-digit age
   reads as a mistake */
.item[data-w="s"] .fin{max-width:190px}
.item[data-w="m"] .fin{max-width:400px}
.item .opt{padding:13px 40px 13px 14px;font-size:15px;gap:12px}
.item .opt .k{width:24px;height:24px;font-size:10.5px}

/* a sub-heading when one screen carries two labelled option groups */
.subh{
  display:block;font-family:var(--fb);font-size:10.5px;font-weight:700;letter-spacing:.19em;
  text-transform:uppercase;color:var(--accent-ink);
  padding-bottom:9px;border-bottom:1px solid var(--ink);margin-bottom:13px;
}

/* ---------- rating rows stacked on one screen ---------- */
.srows{display:block;border-top:1px solid var(--hairline)}
.srow{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(14px,2.4vw,28px);align-items:center;
  padding:clamp(8px,1.25vh,13px) 0;border-bottom:1px solid var(--hairline-2);
  transition:background .25s var(--ease);
}
.srow:last-child{border-bottom:0}
.srow .st{font-size:15px;line-height:1.45;color:var(--body);text-wrap:pretty;transition:color .25s var(--ease)}
.srow.ans .st{color:var(--ink)}
.srow.act .st{color:var(--ink);font-weight:500}
.srow.act::before{
  content:"";position:absolute;left:calc(var(--gut) * -1);width:3px;height:26px;
  background:var(--accent);margin-top:-13px;
}
.srow{position:relative}
.sopts{display:grid;grid-template-columns:repeat(5,clamp(36px,4vw,42px));gap:5px}
.sc-sm{
  display:grid;place-items:center;height:clamp(36px,4vw,42px);
  background:var(--canvas);border:1px solid var(--hairline);
  font-family:var(--fd);font-size:16px;font-weight:700;color:var(--faint);
  font-variant-numeric:lining-nums;
  transition:border-color .2s var(--ease),background .2s var(--ease),color .2s var(--ease);
}
.sc-sm:hover{border-color:var(--ink);color:var(--ink)}
.sc-sm.sel{background:var(--ink);border-color:var(--ink);color:#fff}
.sc-sm:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:clamp(14px,2.4vw,28px);align-items:end;padding-bottom:10px}
.shead .sl{font-size:10px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--muted)}
.shead .sopts span{text-align:center;font-size:10px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums}
.scount{margin-top:16px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.scount b{color:var(--accent-ink);font-weight:700}

/* ---------- required: a gap is named where it is ---------- */
.item > .err{margin-top:10px}
.item.bad > .err{display:block}
.item.bad .opt:not(.sel){border-color:rgba(201,78,0,.5)}
.serr{
  display:none;margin-top:22px;padding:12px 15px;border-left:3px solid var(--accent);
  background:var(--accent-wash);font-size:14px;font-weight:600;line-height:1.5;color:var(--accent-ink);max-width:56ch;
}
.serr.on{display:block}
.srow.miss .st{color:var(--accent-ink)}
.srow.miss .sc-sm:not(.sel){border-color:rgba(201,78,0,.5)}
.slegend{
  display:flex;justify-content:space-between;gap:16px;margin-bottom:12px;
  font-size:10.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);
}
.slegend b{font-family:var(--fd);font-size:14px;letter-spacing:0;color:var(--accent-ink);margin-right:7px}
@media (hover:none){.kb{display:none}}

@media (max-width:760px){
  .items{grid-template-columns:minmax(0,1fr)}
  .item[data-half]{grid-column:1/-1}
  .shead{display:none}
  .srow{grid-template-columns:minmax(0,1fr);gap:11px;padding:16px 0}
  .srow.act::before{display:none}
  .sopts{grid-template-columns:repeat(5,minmax(0,1fr))}
  .sc-sm{height:46px}
}

/* ---------- responsive ---------- */
@media (max-width:900px){
  .wcard{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto}
  .wfig{order:1;min-height:min(44vh,360px)}
  .wquote{right:var(--gut);bottom:20px;max-width:min(410px,calc(100% - var(--gut) * 2))}
  .wcopy{order:2;max-width:none;margin-left:0;padding:clamp(30px,6vw,48px) var(--gut) clamp(38px,7vw,56px)}
  .wcopy::before{left:var(--gut);right:var(--gut);top:0;bottom:auto;width:auto;height:3px}
  body.welcome .stage{align-items:flex-start;overflow-y:auto}
  body.welcome .card{display:block}
}
@media (max-width:640px){
  :root{--top-h:60px}
  .top .wm{display:none}
  /* back stays a square beside the primary, never a full-width empty box */
  .go{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:center}
  .btn.back{width:auto}
  .go .btn{width:100%;justify-content:space-between}
  .go .hint{grid-column:1/-1}
  .pair{grid-template-columns:minmax(0,1fr);gap:22px}
  .opts.grid{grid-template-columns:minmax(0,1fr)}
  .scale{gap:7px;max-width:none}
  .sc{height:60px;font-size:19px}
  .go{gap:14px}
  .btn{width:100%;justify-content:space-between}
  .stage{padding-bottom:104px;align-items:flex-start}
  .meta div{width:50%;border-right:0;padding-right:0;margin-right:0;padding-bottom:14px}
}
/* ---------- phones: a shorter footer bar, and Send kept close ---------- */
@media (max-width:640px){
  :root{--foot-h:54px}
  .stage{padding-bottom:34px}
  /* the answers box stays a bounded list so Send is not 7,000px down the page,
     just shorter, so Send sits close under it */
  .rev{max-height:min(32vh,320px);padding:4px 16px}
}

/* ---------- phones: the welcome's one job is the Begin button ----------
   The desktop split stacks to a photo band over the copy. Left alone the band
   runs 357px and the quote plate lands on Josh's face, which pushes Begin a
   full screen down. A shorter band, no plate, and the signature moved under
   the button put Begin above the fold on a 375x812 phone. */
@media (max-width:640px){
  .wfig{min-height:min(30vh,250px)}
  .wfig img{object-position:52% 22%}
  .wquote{display:none}
  .wcopy{padding:26px var(--gut) 34px}
  .wcopy .chip{margin-bottom:18px}
  .wcopy .qt{font-size:29px}
  .wcopy .qh{font-size:15.5px;margin-top:14px}
  .wcopy .go{margin-top:24px}
  .wcopy .sig{order:1;margin-top:24px;padding-top:20px}
}
/* ---------- touch: no sticky hover ----------
   A phone keeps :hover on whatever was last tapped, so an option you just
   un-ticked stayed nudged right with a dark border, and buttons stayed lit.
   On touch screens the selected state is the only feedback. */
@media (hover:none){
  button{-webkit-tap-highlight-color:transparent}
  .opt:hover,.opt.sel:hover{transform:none}
  .opt:hover:not(.sel){border-color:var(--hairline)}
  .opt:hover:not(.sel) .k{border-color:var(--hairline);color:var(--muted)}
  .item.bad .opt:hover:not(.sel){border-color:rgba(201,78,0,.5)}
  .sc-sm:hover:not(.sel){border-color:var(--hairline);color:var(--faint)}
  .srow.miss .sc-sm:hover:not(.sel){border-color:rgba(201,78,0,.5)}
  .btn:hover svg{transform:none}
  .btn-solid:hover{background:var(--ink)}
  .btn-ghost:hover{background:transparent;color:var(--ink)}
  .btn.back:hover{border-color:var(--hairline)}
  .ctrl button:hover:not(:disabled){background:var(--canvas);border-color:var(--hairline);color:var(--ink)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

var KEY = 'jds_questionnaire_v3';
var A = {};
var idx = 0, dir = 1, advancing = false, actRow = 0;

var stage   = document.getElementById('stage');
var counter = document.getElementById('counter');
var bar     = document.getElementById('bar');
var savedP  = document.getElementById('saved');
var prevBtn = document.getElementById('prevBtn');
var nextBtn = document.getElementById('nextBtn');
var doneEl  = document.getElementById('done');
var RM      = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var LETTERS = 'ABCDEFGHIJKLMNOPQRST';
var ARROW   = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
var SERR    = '<p class="serr" role="alert"></p>';
var BACKSVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>';

function vis(){ return S.filter(function(s){ return !s.if || s.if(A); }); }
function isQ(s){ return s.t !== 'welcome' && s.t !== 'review'; }
function qList(){ return vis().filter(isQ); }
function items(s){ return (s.items || []).filter(function(it){ return !it.if || it.if(A); }); }
function plain(html){ var d = document.createElement('div'); d.innerHTML = html; return d.textContent.trim(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* screens where the whole screen IS one choice — those keep auto-advance */
function isSolo(s){ return s.items && s.items.length === 1 && s.items[0].t === 'single'; }

/* ---------- pieces ---------- */
function head(s){

function advRow(label, hint){

function optBtn(it, o, k, on, multi){
  return '<button type="button" class="opt' + (on ? ' sel' : '') + '" data-n="' + it.n + '" data-v="' + esc(plain(o)) + '"' +
    (multi ? ' aria-pressed="' + on + '"' : ' role="radio" aria-checked="' + on + '"') + '>' +
    '<span class="k">' + LETTERS[k] + '</span><span>' + o + '</span>' +
    '<svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 12 6 6L20 6"/></svg></button>';
}
function renderItem(it, i, focusFirst){
  var body = '';

    var tag = it.t === 'long'
      ? '<textarea class="fin" data-n="' + it.n + '" rows="1" enterkeyhint="next"' + (focusFirst ? ' data-focus' : '') +
        ' placeholder="' + (it.ph || 'Type your answer&hellip;') + '">' + esc(A[it.n] || '') + '</textarea>'
      : '<input class="fin" type="' + (it.ty || (it.v === 'phone' ? 'tel' : 'text')) + '" data-n="' + it.n + '"' +
        (it.v ? ' data-v="' + it.v + '"' : '') +
        (it.v === 'phone' || it.v === 'age' || it.v === 'money' ? ' inputmode="numeric"' : '') +
        ' enterkeyhint="next"' +
        (it.ac ? ' autocomplete="' + it.ac + '"' : '') +
        (focusFirst ? ' data-focus' : '') +
        ' placeholder="' + (it.ph || '') + '" value="' + esc(A[it.n] || '') + '">';
    body = '<label class="fwrap">' + tag + '<span class="err"></span></label>';

  } else if (it.t === 'single') {
    /* Yes/No and other brief lists lay out in a row so the block is one field

    body = '<div class="opts' + (it.grid ? ' grid' : (brief ? ' bin' : '')) + '" role="radiogroup"' + (it.l ? '' : ' aria-label="Choose one"') + '>' +

  } else if (it.t === 'multi') {

    body = '<div class="opts' + (it.grid ? ' grid' : '') + '">' +

  }

  if (it.t === 'single' || it.t === 'multi') body += '<span class="err"></span>';

  return '<div class="item" data-i="' + i + '"' + (it.half ? ' data-half="1"' : '') + (it.w ? ' data-w="' + it.w + '"' : '') + '>' +
    (it.sub ? '<span class="subh">' + it.sub + '</span>' : '') +
    (it.l ? '<span class="il">' + it.l + '</span>' : '') +

}
function renderScale(s){
  var h = '<p class="slegend"><span><b>1</b> Not really me</span><span><b>5</b> Definitely me</span></p>' +
          '<div class="shead" aria-hidden="true"><span class="sl">Statement</span>' +
          '<span class="sopts"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></span></div>' +
          '<div class="srows">';
  s.scale.forEach(function(r, i){
    var v = A[r.n];
    h += '<div class="srow' + (v ? ' ans' : '') + '" data-row="' + i + '" role="radiogroup" aria-label="' + esc(plain(r.l)) + '">' +
         '<span class="st">' + r.l + '</span><div class="sopts">' +
         [1,2,3,4,5].map(function(n){
           return '<button type="button" class="sc-sm' + (v === String(n) ? ' sel' : '') + '" data-row="' + i + '" data-n="' + r.n + '" data-v="' + n + '" role="radio" aria-checked="' + (v === String(n)) + '" aria-label="' + n + ' of 5">' + n + '</button>';
         }).join('') + '</div></div>';
  });
  h += '</div><p class="scount"><b id="scDone">0</b> of ' + s.scale.length + ' answered<span class="kb"> &nbsp;&middot;&nbsp; press <kbd>1</kbd>&ndash;<kbd>5</kbd> to answer and jump to the next</span></p>';
  return h;
}

/* ---------- render ---------- */
function render(){
  var list = vis(), s = list[idx], qs = qList();
  var h = '';
  document.body.classList.toggle('welcome', s.t === 'welcome');

  if (s.t === 'welcome') {
    h = '<div class="wcard">' +
        '<div class="wcopy">' +
          '<span class="chip"><i aria-hidden="true"></i>Confidential Questionnaire</span>' +
          '<h2 class="qt">The questions I&rsquo;d ask on the call, <span class="it">answered first.</span></h2>' +
          '<p class="qh">This helps me understand your goals, style, and what you&rsquo;re looking for before we talk, so our call is spent on finding the right fit, not gathering basics. Go with your gut; there are no wrong answers.</p>' +
          '<div class="sig">' +
            '<img src="assets/josh-avatar-sm.jpg" width="120" height="120" alt="Josh DuBois" onerror="this.style.display=\'none\'">' +
            '<span><b>Josh DuBois</b><i>Founder, JD Strategic Franchising</i></span>' +
          '</div>' +
          '<div class="go">' +
            '<button type="button" class="btn btn-solid" id="ok">Begin' + ARROW + '</button>' +
          '</div>' +
          '<p class="reassure"><b>Confidential.</b> Saved as you go, so you can finish it later. Never shared with a franchisor.</p>' +
        '</div>' +
        '<div class="wfig">' +
          '<img src="assets/josh-portrait.jpg" width="1400" height="1500" alt="Josh DuBois, founder of JD Strategic Franchising" fetchpriority="high" decoding="async">' +
          '<figure class="wquote"><span class="qm" aria-hidden="true">&ldquo;</span>' +
          '<div><p>I&rsquo;ve lived every side of it, the good deals and the bad ones.</p><cite>Josh DuBois, Founder</cite></div>' +
          '</figure>' +
        '</div></div>';

  } else if (s.t === 'review') {
    h = '<span class="chip"><i aria-hidden="true"></i>One last look</span>' +
        '<h2 class="qt">That&rsquo;s everything. <span class="it">Ready to send?</span></h2>' +
        '<p class="qh">Check anything you want to change. Every line is editable. Nothing here is shared with a franchisor.</p>' +
        '<div class="qb"><div class="rev" id="rev">' + reviewHTML() + '</div>' +
        '<div class="senderr" id="senderr"></div></div>' +
        advRow('Send to Josh', 'You&rsquo;ll get a printable copy next');

  } else if (s.scale) {
    actRow = firstUnanswered(s);
    h = head(s) + '<div class="qb">' + renderScale(s) + '</div>' + SERR + advRow('Continue');

  } else {
    var its = items(s), focused = false;
    h = head(s) + '<div class="qb"><div class="items">' +
        its.map(function(it){
          var f = !focused && (it.t === 'text' || it.t === 'long');
          if (f) focused = true;
          return renderItem(it, S.indexOf(s) * 100 + s.items.indexOf(it), f);
        }).join('') +
        '</div></div>' + SERR +
        (isSolo(s)
          ? advRow(false, 'Pick one: or press <kbd>A</kbd>&ndash;<kbd>' + LETTERS[s.items[0].o.length-1] + '</kbd>')
          : advRow());
  }

  card.className = 'card';
  void card.offsetWidth;
  card.innerHTML = h;
  card.className = 'card in' + (dir < 0 ? ' bk' : '');
  stage.scrollTop = 0;
  wire(s);
  chrome(s, qs);
}

function chrome(s, qs){
  var qi = isQ(s) ? qs.indexOf(s) + 1 : 0;
  counter.textContent = s.t === 'welcome' ? 'Confidential Questionnaire'
                      : s.t === 'review'  ? 'Review'
                      : 'Step ' + s.ch + ' of 10';
  var pct = s.t === 'review' ? 1 : (qi ? qi / qs.length : 0);
  bar.style.transform = 'scaleX(' + pct + ')';
  prevBtn.disabled = idx === 0;
  nextBtn.disabled = idx >= vis().length - 1;
  card.querySelectorAll('.btn.back').forEach(function(b){ b.disabled = idx === 0; });
}

/* ---------- wiring ---------- */
function wire(s){
  var ok = card.querySelector('#ok');
  if (ok) ok.addEventListener('click', function(){ next(); });
  card.querySelectorAll('.btn.back').forEach(function(b){ b.addEventListener('click', prev); });

  var f = card.querySelector('[data-focus]');
  if (f && !('ontouchstart' in window)) setTimeout(function(){ f.focus({preventScroll:true}); }, RM ? 0 : 340);

  card.querySelectorAll('.fin').forEach(function(el){
    if (el.tagName === 'TEXTAREA') { grow(el); el.addEventListener('input', function(){ grow(el); }); }
    el.addEventListener('input', function(){
      if (el.dataset.v === 'phone') {
        var at = el.selectionStart, was = el.value.length;
        el.value = fmtPhone(el.value);
        var d = el.value.length - was;
        if (at !== null && at < was) el.setSelectionRange(at + d, at + d);
      }
      if (el.dataset.v === 'age') el.value = el.value.replace(/\D/g, '').slice(0, 3);
      A[el.dataset.n] = el.value;
      var w = el.closest('.fwrap'); if (w) w.classList.remove('bad');
      save();
    });
    if (el.dataset.v === 'money') {
      el.addEventListener('blur', function(){
        el.value = fmtMoney(el.value); A[el.dataset.n] = el.value; save();
      });
    }
  });

  card.querySelectorAll('.opt').forEach(function(b){
    var it = findItem(s, b.dataset.n);
    b.addEventListener('click', function(){
      if (it.t === 'single') pickOne(s, it, b); else toggle(it, b);
    });
  });

  card.querySelectorAll('.sc-sm').forEach(function(b){
    b.addEventListener('click', function(){ setScale(s, +b.dataset.row, b.dataset.v); });
  });
  if (s.scale) markRow(s);
}
function findItem(s, n){
  var out = null;
  (s.items || []).forEach(function(it){ if (it.n === n) out = it; });
  return out;
}
function grow(el){ el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 220) + 'px'; }

function pickOne(s, it, b){
  card.querySelectorAll('.opt[data-n="' + it.n + '"]').forEach(function(x){
    x.classList.remove('sel'); x.setAttribute('aria-checked', 'false');
  });
  b.classList.add('sel'); b.setAttribute('aria-checked', 'true');
  A[it.n] = b.dataset.v;
  clearBad(b);
  save();
  syncItems(s);
  if (isSolo(s)) hop();
}
function toggle(it, b){
  var v = b.dataset.v, list = A[it.n] || [], at = list.indexOf(v);
  if (at > -1) list.splice(at, 1); else list.push(v);
  A[it.n] = list;
  b.classList.toggle('sel', at === -1);
  b.setAttribute('aria-pressed', String(at === -1));
  if (at === -1) clearBad(b);

  save();
}
function clearBad(b){ var w = b.closest('.item'); if (w) w.classList.remove('bad'); }
/* a conditional follow-up appears in place instead of becoming another screen */
function syncItems(s){
  if (!s.items) return;
  s.items.forEach(function(it, i){
    if (!it.if) return;
    var el = card.querySelector('.item[data-i="' + (S.indexOf(s) * 100 + i) + '"]');
    var show = it.if(A);
    if (el) { el.classList.toggle('hide', !show); return; }
    if (show) render();
  });
}

/* ---------- rating rows ---------- */
function firstUnanswered(s){
  for (var i = 0; i < s.scale.length; i++) if (!A[s.scale[i].n]) return i;
  return s.scale.length - 1;
}
function markRow(s){
  var done = 0;
  card.querySelectorAll('.srow').forEach(function(r){
    var i = +r.dataset.row;
    r.classList.toggle('act', i === actRow);
    var on = !!A[s.scale[i].n];
    r.classList.toggle('ans', on);
    if (on) done++;
  });
  var c = card.querySelector('#scDone'); if (c) c.textContent = done;
  return done;
}
function setScale(s, row, val){
  A[s.scale[row].n] = String(val);
  card.querySelectorAll('.sc-sm[data-row="' + row + '"]').forEach(function(x){
    var on = x.dataset.v === String(val);
    x.classList.toggle('sel', on); x.setAttribute('aria-checked', String(on));
  });
  var rowEl = card.querySelector('.srow[data-row="' + row + '"]');
  if (rowEl) rowEl.classList.remove('miss');
  var se = card.querySelector('.serr.on');
  if (se) { var m = screenMsg(s); se.innerHTML = m || ''; se.classList.toggle('on', !!m); }
  save();
  var nextRow = -1;
  for (var i = 0; i < s.scale.length; i++) if (!A[s.scale[i].n]) { nextRow = i; break; }
  actRow = nextRow > -1 ? nextRow : row;
  var done = markRow(s);
  if (nextRow > -1) {
    var el = card.querySelector('.srow[data-row="' + nextRow + '"]');
    if (el) el.scrollIntoView({block:'nearest', behavior: RM ? 'auto' : 'smooth'});
  } else if (done === s.scale.length) {
    hop();  /* whole group answered - move on */
  }
}
function hop(){
  if (advancing) return;
  advancing = true;
  setTimeout(function(){ advancing = false; next(); }, RM ? 60 : 340);
}

/* ---------- movement ---------- */
function next(){
  var list = vis(), s = list[idx];
  if (isQ(s) && !valid(s)) return;
  if (s.t === 'review') {
    /* answers saved before every question was required, or edited from the
       review, can leave a gap. Send them to it instead of sending. */
    for (var j = 0; j < list.length; j++) {
      if (isQ(list[j]) && !complete(list[j])) { dir = -1; idx = j; render(); save(); valid(list[j]); return; }
    }
    submit(); return;
  }
  if (idx < list.length - 1) { dir = 1; idx++; render(); save(); }
}
function prev(){ if (idx > 0) { dir = -1; idx--; render(); save(); } }

prevBtn.addEventListener('click', prev);
nextBtn.addEventListener('click', function(){ next(); });

/* ---------- validation ----------------------------------------------------
   Every question is required before the screen can be left: text, choices and
   every rating row. Continue, the arrow buttons, the keyboard and the final
   send all go through next(), so nothing gets past valid().

   One exception. Each industry category stays optional, because the copy asks
   people to leave blank what they would rule out, and forcing a pick would put
   false interests in front of Josh. The section as a whole needs at least one.
   ------------------------------------------------------------------------ */
var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

function fmtPhone(v){
  var d = String(v).replace(/\D/g, '').slice(0, 10);
  if (d.length < 4) return d;
  if (d.length < 7) return '(' + d.slice(0,3) + ') ' + d.slice(3);
  return '(' + d.slice(0,3) + ') ' + d.slice(3,6) + '-' + d.slice(6);
}
function fmtMoney(v){
  var t = String(v).trim();
  if (!/^\$?[\d,]+$/.test(t)) return t;      /* leave ranges, words and "k" alone */
  var d = t.replace(/\D/g, '');
  return d ? '$' + Number(d).toLocaleString('en-US') : t;
}
function fieldErr(it, raw){
  var v = String(raw || '').trim();
  if (!v) {
    if (it.ty === 'email' && it.req) return 'I need an email to send anything back to.';
    if (it.v === 'phone') return 'I need a number to confirm the call.';
    if (it.need) return it.need;
    if (it.v === 'money') return 'A rough figure is fine, or 0 if none.';
    if (it.t === 'long') return 'A sentence or two is plenty.';
    return 'This one I do need.';
  }
  if (it.v === 'phone') {
    var d = v.replace(/\D/g, '');
    if (d.length !== 10) return 'That’s ' + d.length + ' digit' + (d.length === 1 ? '' : 's') + ' — a US number needs 10.';
  }
  if (it.v === 'age') {
    if (!/^\d+$/.test(v)) return 'Numbers only, please.';
    var n = Number(v);
    if (n < 18 || n > 100) return 'Please enter an age between 18 and 100.';
  }
  if (it.v === 'money' && !/\d/.test(v)) return 'Please include a number — a rough figure is fine.';
  if (it.ty === 'email' && !EMAIL_RE.test(v)) return 'That email doesn’t look right.';
  return null;
}
function isInd(it){ return it.t === 'multi' && /^ind_/.test(it.n); }
function anyIndustry(){
  return S.some(function(x){ return (x.items || []).some(function(it){ return isInd(it) && A[it.n] && A[it.n].length; }); });
}
function lastIndScreen(s){
  var ind = vis().filter(function(x){ return (x.items || []).some(isInd); });
  return ind[ind.length - 1] === s;
}
/* what is wrong with one question, from the answers alone */
function itemMsg(it){
  var v = A[it.n];
  if (it.t === 'text' || it.t === 'long') return fieldErr(it, v);
  if (it.t === 'single') return v ? null : 'Pick one to keep going.';
  if (it.t === 'multi') return isInd(it) || (v && v.length) ? null : 'Pick at least one.';
  return null;
}
/* what is wrong with the screen as a whole */
function screenMsg(s){
  if (s.scale) {
    var left = s.scale.filter(function(r){ return !A[r.n]; }).length;
    if (!left) return null;
    return left === s.scale.length ? 'Rate each statement to keep going.'
         : left === 1 ? 'One statement left to rate.'
         : left + ' statements left to rate.';
  }
  if (lastIndScreen(s) && !anyIndustry()) return 'Pick at least one industry that interests you, here or on the screens before this one.';
  return null;
}
function complete(s){
  if (!isQ(s)) return true;
  if (screenMsg(s)) return false;
  return items(s).every(function(it){ return !itemMsg(it); });
}
/* check the screen on show, mark every gap, and take the visitor to the first */
function valid(s){
  if (!isQ(s)) return true;
  var first = null;
  items(s).forEach(function(it){
    var el, w, msg;
    if (it.t === 'text' || it.t === 'long') {
      el = card.querySelector('.fin[data-n="' + it.n + '"]');
      if (!el) return;
      msg = fieldErr(it, el.value);
      w = el.closest('.fwrap');
    } else {
      el = card.querySelector('.opt[data-n="' + it.n + '"]');
      if (!el) return;
      msg = itemMsg(it);
      w = el.closest('.item');
    }
    if (!w) return;
    w.classList.toggle('bad', !!msg);
    var e = w.querySelector('.err'); if (e && msg) e.innerHTML = msg;
    if (msg && !first) first = el;
  });
  var sm = screenMsg(s), se = card.querySelector('.serr');
  if (se) { se.innerHTML = sm || ''; se.classList.toggle('on', !!sm); }
  if (sm && s.scale) {
    card.querySelectorAll('.srow').forEach(function(r){ r.classList.toggle('miss', !A[s.scale[+r.dataset.row].n]); });
    actRow = firstUnanswered(s); markRow(s);
    if (!first) first = card.querySelector('.srow[data-row="' + actRow + '"]');
  } else if (sm && !first) first = se;
  if (first) {
    if (first.classList.contains('fin')) first.focus({preventScroll:true});
    first.scrollIntoView({block:'center', behavior: RM ? 'auto' : 'smooth'});
  }
  return !first;
}

/* ---------- keyboard ---------- */
document.addEventListener('keydown', function(e){
  if (doneEl.classList.contains('on')) return;
  var s = vis()[idx];
  var typing = e.target.classList && e.target.classList.contains('fin');

  if (e.key === 'Enter') {
    if (e.target.tagName === 'TEXTAREA' && e.shiftKey) return;
    e.preventDefault();
    if (typing) {
      var fs = [].slice.call(card.querySelectorAll('.fin')).filter(function(x){ return x.offsetParent !== null; });
      var at = fs.indexOf(e.target);
      if (at > -1 && at < fs.length - 1) { fs[at + 1].focus(); return; }
    }
    next(); return;
  }
  if (typing) return;

  if (e.key === 'ArrowDown' || e.key === 'PageDown') { e.preventDefault(); next(); return; }
  if (e.key === 'ArrowUp'   || e.key === 'PageUp')   { e.preventDefault(); prev(); return; }

  /* rating group: answer the live row and drop to the next one */
  if (s.scale && /^[1-5]$/.test(e.key)) { e.preventDefault(); setScale(s, actRow, e.key); return; }
  if (s.scale && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) return;

  /* letter keys only when exactly one choice list is on screen */
  if (s.items && /^[a-z]$/i.test(e.key)) {
    var choice = items(s).filter(function(it){ return it.t === 'single' || it.t === 'multi'; });
    if (choice.length !== 1) return;
    var k = LETTERS.indexOf(e.key.toUpperCase());
    var btns = card.querySelectorAll('.opt[data-n="' + choice[0].n + '"]');
    if (k > -1 && btns[k]) {
      e.preventDefault();
      choice[0].t === 'single' ? pickOne(s, choice[0], btns[k]) : toggle(choice[0], btns[k]);
    }
  }
});

/* ---------- autosave ---------- */
var t1, t2, submitted = false;
function save(){
  if (submitted) return;
  clearTimeout(t1);
  t1 = setTimeout(function(){
    var d = {}; for (var k in A) d[k] = A[k];
    d.__i = idx;
    try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(err){ return; }
    savedP.classList.add('on');
    clearTimeout(t2);
    t2 = setTimeout(function(){ savedP.classList.remove('on'); }, 1600);
  }, 420);
}
(function restore(){
  var raw; try { raw = localStorage.getItem(KEY); } catch(err){ return; }
  if (!raw) return;
  var d; try { d = JSON.parse(raw); } catch(err){ return; }
  var i = d.__i; delete d.__i;
  A = d;
  if (typeof i === 'number') idx = Math.min(Math.max(i, 0), vis().length - 1);
  var list = vis();
  for (var j = 0; j < idx; j++) if (isQ(list[j]) && !complete(list[j])) { idx = j; break; }
})();

document.getElementById('clearBtn').addEventListener('click', function(){
  if (!confirm('Clear every answer and start over? This cannot be undone.')) return;
  try { localStorage.removeItem(KEY); } catch(err){}
  A = {}; idx = 0; dir = 1; render();
});

/* ---------- review + printable summary ---------- */
function rows(forPrint){
  var out = '', lastCh = 0;
  vis().forEach(function(s){
    if (!isQ(s)) return;
    var pairs = [];
    if (s.scale) {
      s.scale.forEach(function(r){ if (A[r.n]) pairs.push([plain(r.l), A[r.n] + ' / 5']); });
    } else {
      items(s).forEach(function(it){
        var v = A[it.n];
        if (Array.isArray(v)) v = v.join(', ');
        if (v) pairs.push([plain(it.l || it.sub || s.q), v]);
      });
    }
    if (!pairs.length) return;
    if (s.ch !== lastCh) {
      lastCh = s.ch;
      out += forPrint ? '<h2>' + CH[s.ch-1] + '</h2>' : '<h4>' + CH[s.ch-1] + '</h4>';
    }
    pairs.forEach(function(p){
      out += '<div class="r"><span class="k">' + esc(p[0]) +
             (forPrint ? '' : '<button type="button" class="edit" data-i="' + S.indexOf(s) + '">Edit</button>') +
             '</span><span class="v">' + esc(p[1]) + '</span></div>';
    });
  });
  return out;
}
function reviewHTML(){
  return rows(false) || '<p class="none">Nothing answered yet. Use the arrows to go back through the questions.</p>';
}
function finish(){
  var nm = A.name ? ' &middot; ' + esc(A.name) : '';
  document.getElementById('psum').innerHTML =
    '<h1>Confidential Franchising Questionnaire</h1>' +
    '<p class="sub">JD Strategic Franchising &middot; Josh DuBois' + nm + ' &middot; ' +
    new Date().toLocaleDateString('en-US', {year:'numeric', month:'long', day:'numeric'}) + '</p>' +
    rows(true);
  doneEl.classList.add('on');
  doneEl.focus();
}

/* ==========================================================================
   SUBMIT -> GoHighLevel inbound webhook
   ========================================================================== */
/* Primary target is the intake worker: it upserts the contact over the GHL API
   with every answer already on the right custom field, then forwards this same
   payload to the inbound webhook so the existing workflow still fires.

   FALLBACK is the inbound webhook on its own. If the worker is down, or is not
   deployed yet, the submission still lands in GHL exactly the way it did
   before - name, email and phone on the contact, everything else on the
   webhook payload. A submission is never lost because of the worker. */
var WORKER  = 'https://jd-questionnaire.javier-d51.workers.dev/submit';
var WEBHOOK = 'https://services.leadconnectorhq.com/hooks/kv44OG3YsodryGm2KCvt/webhook-trigger/f23bd6a8-c76f-4dbe-849c-e67e88d2c9a8';
var sending = false;

/* Flat keys - GHL maps a flat JSON body onto contact and custom fields far
   more easily than a nested one. Multi-selects become comma lists. */
function payload(){
  var p = {}, nm = String(A.name || '').trim(), sp = nm.split(/\s+/);
  p.full_name  = nm;
  p.first_name = sp[0] || '';
  p.last_name  = sp.slice(1).join(' ');
  p.email      = A.email || '';
  p.phone      = A.phone || '';

  vis().forEach(function(s){
    if (!isQ(s)) return;
    if (s.scale) { s.scale.forEach(function(r){ if (A[r.n]) p[r.n] = A[r.n]; }); return; }
    items(s).forEach(function(it){
      var v = A[it.n];
      if (Array.isArray(v)) v = v.join(', ');
      if (v !== undefined && v !== null && v !== '') p[it.n] = v;
    });
  });

  p.source       = 'JD Strategic Confidential Questionnaire';
  p.submitted_at = new Date().toISOString();
  /* a readable transcript, so the submission is useful even before anyone
     maps a single custom field in GHL */
  p.summary = textSummary();
  return p;
}

function textSummary(){
  var out = [], lastCh = 0;
  vis().forEach(function(s){
    if (!isQ(s)) return;
    var lines = [];
    if (s.scale) {
      s.scale.forEach(function(r){ if (A[r.n]) lines.push('  ' + plain(r.l) + '  ->  ' + A[r.n] + '/5'); });
    } else {
      items(s).forEach(function(it){
        var v = A[it.n];
        if (Array.isArray(v)) v = v.join(', ');
        if (v) lines.push('  ' + plain(it.l || it.sub || s.q) + ': ' + v);
      });
    }
    if (!lines.length) return;
    if (s.ch !== lastCh) { lastCh = s.ch; out.push('', CH[s.ch-1].toUpperCase()); }
    out.push(lines.join('\n'));
  });
  return out.join('\n').trim();
}

/* application/json, plainly. GHL answers the CORS preflight (204, allow-headers *)
   so there is nothing to work around.

   CRITICAL: this endpoint returns HTTP 200 even when it REJECTS the body -
   a text/plain post comes back 200 with
     {"status":"Error: Request has invalid data: Body payload..."}
   and nothing reaches the workflow. So the status code is not the result.
   Read the body and treat an "Error" status as a failure. */
function post(url, data){
  return fetch(url, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(data)
  }).then(function(r){
    return r.text().then(function(txt){
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + txt.slice(0, 160));
      if (/"ok"\s*:\s*false|Error:/i.test(txt)) throw new Error(txt.slice(0, 200));
      return txt;
    });
  });
}

function send(data){
  return post(WORKER, data).catch(function(err){
    /* Worker unreachable or erroring. Go straight at the webhook so the
       answers still land, and leave a breadcrumb in the console. */
    if (window.console) console.warn('worker submit failed, using webhook', err.message);
    return post(WEBHOOK, data);
  });
}

function submit(){
  if (sending) return;
  var btn = card.querySelector('#ok');
  var err = card.querySelector('#senderr');

  /* a filled honeypot means a bot - show the thank-you, send nothing */
  var hp = document.getElementById('company_website');
  if (hp && hp.value) { finish(); return; }

  sending = true;
  if (err) err.classList.remove('on');
  if (btn) { btn.disabled = true; btn.innerHTML = 'Sending&hellip;'; }

  send(payload()).then(function(){
    sending = false;
    submitted = true;
    clearTimeout(t1);               /* kill the debounced autosave before clearing */
    try { localStorage.removeItem(KEY); } catch(e){}
    finish();                       /* A stays in memory, so the printable copy still builds */
  }).catch(function(){
    sending = false;
    if (btn) { btn.disabled = false; btn.innerHTML = 'Try again' + ARROW; }
    if (err) {
      err.innerHTML = '<b>That didn&rsquo;t go through.</b> Your answers are still saved on ' +
        'this device, so nothing is lost: try again, or email them to ' +
        '<a href="mailto:josh@jdfranchising.com">josh@jdfranchising.com</a> and I&rsquo;ll pick it up from there.';
      err.classList.add('on');
      err.scrollIntoView({block:'nearest', behavior: RM ? 'auto' : 'smooth'});
    }
  });
}

document.getElementById('printBtn').addEventListener('click', function(){ window.print(); });

card.addEventListener('click', function(e){
  var b = e.target.closest('.edit'); if (!b) return;
  var target = vis().indexOf(S[+b.dataset.i]);
  if (target > -1) { dir = -1; idx = target; render(); }
});

render();
})();
</script>
